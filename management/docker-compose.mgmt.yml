# jenkins
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    privileged: true
    user: root
    restart: unless-stopped
    ports:
      - "8084:8080"   
      - "50000:50000" # Jenkins agent communication
    volumes:
      - jenkins-data:/var/jenkins-data
      # Optional: Mount the docker socket to run docker commands inside Jenkins
      - /var/run/docker.sock:/var/run/docker.sock

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    depends_on:
      postgres-sonarqube:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonarqube:5432/sonar
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - ecommerce-network

  postgres-sonarqube:
    image: postgres:15-alpine
    container_name: sonarqube_db
    environment:
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network
  
  nexus:
    image: sonatype/nexus3:3.98.1
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8091:8081"
      - "5000:5000"        
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms1g -Xmx2g -XX:MaxDirectMemorySize=2g -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
    volumes:
      - nexus-data:/nexus-data

networks:
  ecommerce-network:
    driver: bridge
    name: buy01-ecommerce-network


volumes:
  jenkins-data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
  nexus-data:
