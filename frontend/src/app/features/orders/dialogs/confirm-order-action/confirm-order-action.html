<div class="confirm-dialog">
  <div class="dialog-icon" [class.destructive]="data.destructive" aria-hidden="true">
    <lucide-angular
      [img]="data.destructive ? AlertTriangle : Info"
      [size]="22"
    ></lucide-angular>
  </div>

  <h2 mat-dialog-title>{{ data.title }}</h2>

  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button (click)="close(false)">
      {{ data.cancelLabel ?? 'Keep order' }}
    </button>
    <button
      type="button"
      mat-flat-button
      [color]="data.destructive ? 'warn' : 'primary'"
      (click)="close(true)"
    >
      {{ data.confirmLabel ?? 'Confirm' }}
    </button>
  </mat-dialog-actions>
</div>
