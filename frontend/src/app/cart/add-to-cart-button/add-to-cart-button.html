<button
  type="button"
  [class]="buttonClass()"
  [class.btn-icon]="iconOnly()"
  [class.is-added]="status() === 'added'"
  [disabled]="disabled()"
  [attr.aria-busy]="status() === 'loading'"
  [attr.aria-label]="ariaLabel()"
  (click)="add($event)"
  (keydown.enter)="$event.stopPropagation()"
>
  @switch (status()) {
    @case ('loading') {
      <span class="spinner" aria-hidden="true"></span>
      @if (!iconOnly()) {
        Adding…
      }
    }
    @case ('added') {
      <lucide-angular [img]="Check" [size]="18"></lucide-angular>
      @if (!iconOnly()) {
        Added
      }
    }
    @default {
      <lucide-angular [img]="ShoppingCart" [size]="18"></lucide-angular>
      @if (!iconOnly()) {
        Add to cart
      }
    }
  }
</button>
